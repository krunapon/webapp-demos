<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JavaScript Object Example</title>
  </head>
  <body>
    <h2>JavaScript Object Example</h2>
    <p id="demo"></p>
    <script>
      const person = {
        name: "Manee Deejai",
        street: "123 Mittrapap Rd.",
        phone: "043 009700",
      };
      document.querySelector("#demo").innerHTML =
        `${person["name"]}<br/>${person["street"]}<br/>${person["phone"]}`;
    </script>
  </body>
</html>
