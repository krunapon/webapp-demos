<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Simple DOM example</title>
    </head>
    <body>
        <section>
            <img src="https://building.kku.ac.th/wp-content/uploads/2019/08/Th_color.png" alt="KKU">
            <p>Here we will add a link to the 
                <a href="http://www.kku.ac.th">KKU</a></p>
        </section>
        <script>
            let sectionElem = document.querySelector('section');
            let pElem = document.querySelector('p');
            let aElem = document.querySelector('a');
            let imgElem = document.querySelector('img');

            let newLink = document.createElement('a');
            newLink.href = 'http://www.en.kku.ac.th';
            newLink.target = "_blank";
            pElem.removeChild(aElem);
            newLink.appendChild(imgElem);
    

            let textNode = document.createTextNode('We hope you enjoy learning');
            pElem.removeChild(pElem.childNodes[0]);
            pElem.appendChild(textNode);
            sectionElem.appendChild(newLink);
            sectionElem.appendChild(pElem);
            
            pElem.style.backgroundColor = 'black';
            pElem.style.color = 'white';
            pElem.style.padding = '10px';

            imgElem.src = "images/en-kku.jpg";
            imgElem.style.width = '520px';
            pElem.style.width =  '500px';
            pElem.style.textAlign = 'center';
        </script>
</html>
