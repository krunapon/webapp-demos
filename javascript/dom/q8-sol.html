<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Challenge: Create a solar system</title>
    <style>
      body {
        background-color: black;
        padding: 10px;
      }

      .planet {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        text-align: center;
        padding: 10px;
        position: relative;
      }

      .moon {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgb(237, 237, 237);
      }
    </style>
  </head>

  <body>
    <script>
      let planetElm = document.createElement("div");
      planetElm.className = "planet";
      planetElm.style.backgroundColor = "grey";
      let moonElm = document.createElement("div");
      moonElm.className = "moon";
      moonElm.style.backgroundColor = "yellow";
      planetElm.appendChild(moonElm);
      document.body.appendChild(planetElm);
    </script>
  </body>
</html>
