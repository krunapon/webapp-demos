<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Challenge: Classification</title>
    <style>
      .right-answer {
        background: rgb(0, 255, 9);
      }

      .wrong-answer {
        background: rgb(237, 28, 0);
      }
    </style>
  </head>
  <body>
    <h2>Pop Quiz: Animal Classification</h2>

    <p>Which animal class do humans belong to?</p>
    <ul id="answers">
      <li>Mammalia</li>
      <li>Ascidiacea</li>
      <li>Reptilia</li>
    </ul>

    <script>
      const answers = document.querySelectorAll("#answers li");
      let rightAnswer = answers[0];
      let wrongAnswer1 = answers[1];
      let wrongAnswer2 = answers[2];
      rightAnswer.addEventListener("click", function () {
        this.className = "right-answer";
      });
      wrongAnswer1.addEventListener("click", function () {
        wrongAnswer(this);
      });
      wrongAnswer2.addEventListener("click", function () {
        wrongAnswer(this);
      });
      function wrongAnswer(e) {
        e.className = "wrong-answer";
      }
    </script>
  </body>
</html>
